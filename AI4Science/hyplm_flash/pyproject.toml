[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyplm"
version = "1.0.0"
description = "HyPLM-Flash: an efficient, open protein language model with a fast GPU inference engine"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.4", "safetensors>=0.4", "triton>=3.2", "flash-attn>=2.6", "numpy"]

[tool.setuptools.packages.find]
include = ["hyplm*"]
