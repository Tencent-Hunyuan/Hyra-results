name = "PartialHadamardCounting"
defaultTargets = ["PartialHadamardCounting"]

# Keep the cloneable release tag here; `lake-manifest.json` locks its exact
# commit (`520045ab14e26149ee970e2e617ca04b09bde5d6`).
# The matching Lean toolchain (leanprover/lean4:v4.32.1) is recorded in
# `lean-toolchain`.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.1"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

# Lake roots are module names, not filenames; no `.lean` suffix is used.
[[lean_lib]]
name = "PartialHadamardCounting"
srcDir = "."
roots = ["PartialHadamard"]
