name = "BeurlingAhlforsBound"
defaultTargets = ["BeurlingAhlforsBound"]

# The matching toolchain is in `lean-toolchain`; `lake-manifest.json` locks the
# exact mathlib commit for reproducibility.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.1"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[lean_lib]]
name = "BeurlingAhlforsBound"
srcDir = "."
roots = ["BeurlingAhlfors"]
