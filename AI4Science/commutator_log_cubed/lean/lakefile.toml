name = "CubicLogCommutatorsProof"
defaultTargets = ["CubicLogCommutatorsProof"]

# The release tag is cloneable; lake-manifest.json pins the exact mathlib
# commit 520045ab14e26149ee970e2e617ca04b09bde5d6.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.1"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[lean_lib]]
name = "CubicLogCommutatorsProof"
srcDir = "."
roots = ["CubicLogCommutators"]
